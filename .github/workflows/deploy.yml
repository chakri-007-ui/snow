name: Multi Environment Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Snowflake Connector
        run: pip install snowflake-connector-python

      - name: Execute SQL Files
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

          DEV_SNOWFLAKE_DATABASE: ${{ secrets.DEV_SNOWFLAKE_DATABASE }}
          DEV_SNOWFLAKE_SCHEMA: ${{ secrets.DEV_SNOWFLAKE_SCHEMA }}

          PROD_SNOWFLAKE_DATABASE: ${{ secrets.PROD_SNOWFLAKE_DATABASE }}
          PROD_SNOWFLAKE_SCHEMA: ${{ secrets.PROD_SNOWFLAKE_SCHEMA }}

        run: |
          python <<EOF
          import snowflake.connector
          import glob
          import os

          branch = os.environ.get("GITHUB_REF_NAME")
          print(f"Deploying branch: {branch}")

          if branch == "develop":
              database = os.environ["DEV_SNOWFLAKE_DATABASE"]
              schema = os.environ["DEV_SNOWFLAKE_SCHEMA"]
              print("Deploying to DEV...")
          else:
              database = os.environ["PROD_SNOWFLAKE_DATABASE"]
              schema = os.environ["PROD_SNOWFLAKE_SCHEMA"]
              print("Deploying to PROD...")

          conn = snowflake.connector.connect(
              user=os.environ["SNOWFLAKE_USERNAME"],
              password=os.environ["SNOWFLAKE_PASSWORD"],
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"]
          )

          cursor = conn.cursor()

          try:
              cursor.execute(f"USE DATABASE {database}")
              cursor.execute(f"USE SCHEMA {schema}")

              for file in sorted(glob.glob("sql/*.sql")):
                  print(f"Executing {file}")
                  with open(file, "r") as f:
                      sql = f.read()

                  for stmt in sql.split(";"):
                      if stmt.strip():
                          cursor.execute(stmt)

              print("✅ Deployment successful!")

          finally:
              cursor.close()
              conn.close()
          EOF
